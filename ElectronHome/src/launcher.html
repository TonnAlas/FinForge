<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FinForge Launcher</title>
<script src="./vendor/tailwind.launcher.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          'surface': '#040b18',
          'surface-dim': '#040b18',
          'surface-bright': '#1c2638',
          'surface-container-lowest': '#030914',
          'surface-container-low': '#08101e',
          'surface-container': '#0b1422',
          'surface-container-high': '#0f1828',
          'surface-container-highest': '#162030',
          'background': '#040b18',
          'on-surface': '#e8edf6',
          'on-surface-variant': '#d8dce8',
          'on-background': '#e8edf6',
          'outline': '#8a90a0',
          'outline-variant': '#505868',
          'primary': '#adc6ff',
          'on-primary': '#002e6a',
          'primary-container': '#4d8eff',
          'on-primary-container': '#00285d',
          'secondary': '#4edea3',
          'on-secondary': '#003824',
          'secondary-container': '#00a572',
          'on-secondary-container': '#00311f',
          'tertiary': '#ffb95f',
          'error': '#ffb4ab',
          'on-error': '#690005',
          'error-container': '#93000a',
          'on-error-container': '#ffdad6'
        }
      }
    }
  }
</script>
<style>
  html, body {
    height: 100%;
  }
  body {
    background-color: #040b18;
    color: #e8edf6;
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size: 13px;
    margin: 0;
    overflow: hidden;
  }
  .mono {
    font-family: 'JetBrains Mono', monospace;
  }

  /* ── Background with grid + glow ── */
  .bg-screen {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 40% at 50% 20%, rgba(173, 198, 255, 0.07), transparent 70%),
      radial-gradient(ellipse 50% 30% at 50% 80%, rgba(78, 222, 163, 0.04), transparent 60%),
      linear-gradient(180deg, #08101e 0%, #040b18 100%);
  }
  .bg-screen::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(80, 88, 104, 0.12) 1px, transparent 1px),
      linear-gradient(90deg, rgba(80, 88, 104, 0.12) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
  }

  /* ── Decorative corner blocks ── */
  .deco-corner {
    position: fixed;
    width: 32px;
    height: 32px;
    border: 1px solid rgba(80, 88, 104, 0.25);
    pointer-events: none;
    z-index: 0;
  }
  .deco-tl { top: 32px; left: 32px; border-right: none; border-bottom: none; }
  .deco-tr { top: 32px; right: 32px; border-left: none; border-bottom: none; }
  .deco-bl { bottom: 32px; left: 32px; border-right: none; border-top: none; }
  .deco-br { bottom: 32px; right: 32px; border-left: none; border-top: none; }

  /* ── Login-style card ── */
  .login-card {
    position: relative;
    width: 420px;
    max-width: 92vw;
    background: #0b1422;
    border: 1px solid #505868;
    padding: 32px 28px 28px;
    z-index: 1;
  }

  /* ── Brand block ── */
  .login-brand {
    text-align: center;
    margin-bottom: 28px;
  }
  .login-brand .brand-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 28px;
    font-weight: 700;
    color: #adc6ff;
  }
  .login-brand h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #e8edf6;
    margin: 0 0 6px;
    line-height: 1.1;
  }
  .login-brand p {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: #8a90a0;
    margin: 0;
  }

  /* ── Action buttons (terminal style) ── */
  .term-btn {
    display: block;
    width: 100%;
    border: 1px solid #505868;
    background: #0f1828;
    color: #e8edf6;
    text-align: left;
    padding: 10px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    line-height: 1.2;
  }
  .term-btn:hover {
    background: #162030;
    border-color: #8a90a0;
  }
  .term-btn.primary-action {
    background: #162030;
    border-color: #adc6ff;
    color: #adc6ff;
    font-size: 13px;
    text-align: center;
    letter-spacing: 0.14em;
    padding: 12px 14px;
  }
  .term-btn.primary-action:hover {
    background: #1c2638;
    border-color: #adc6ff;
  }
  .term-btn.danger {
    color: #ffb4ab;
  }
  .term-btn.danger:hover {
    background: #162030;
    border-color: #ffb4ab;
  }
  .term-btn.success {
    background: #004d40;
    border-color: #4edea3;
    color: #4edea3;
    cursor: default;
    text-align: center;
    letter-spacing: 0.14em;
  }
  .term-btn.success:hover {
    background: #004d40;
    border-color: #4edea3;
  }
  .term-btn:disabled {
    opacity: 0.6;
    cursor: default;
  }
  .term-btn:disabled:hover {
    background: #0f1828;
    border-color: #505868;
  }

  /* ── Button groups ── */
  .btn-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
  }

  /* ── Status row at bottom ── */
  .status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid #505868;
  }
  .status-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    margin-right: 6px;
  }
  .status-dot.green { background: #4edea3; }
  .status-dot.amber { background: #ffb95f; }
  .status-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #d8dce8;
  }

  /* ── Font size (top-right) ── */
  .top-actions {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 2;
  }
  .font-size-group {
    display: inline-flex;
    align-items: center;
    border: 1px solid #424754;
    background: #212b39;
    line-height: 1;
  }
  .font-size-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    padding: 2px 5px;
    border: none;
    background: transparent;
    color: #d9e3f6;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 20px;
  }
  .font-size-btn:hover {
    background: #2b3544;
    color: #adc6ff;
  }
  .font-size-btn.minus { border-right: 1px solid #424754; }
  .font-size-btn.plus  { border-left: 1px solid #424754; }
  .font-size-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    padding: 2px 6px;
    min-width: 28px;
    text-align: center;
    color: #d9e3f6;
    letter-spacing: 0.02em;
    user-select: none;
  }

  /* ── Footer ── */
  .footer-copy {
    position: fixed;
    bottom: 14px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.08em;
    color: rgba(138, 144, 160, 0.4);
    z-index: 1;
    pointer-events: none;
    text-transform: uppercase;
  }

  /* ── Scalable ── */
  .scalable {
    zoom: var(--font-scale, 1);
  }
  body[data-font-scale="0.85"] { --font-scale: 0.85; }
  body[data-font-scale="1"]    { --font-scale: 1; }
  body[data-font-scale="1.15"] { --font-scale: 1.15; }
  body[data-font-scale="1.3"]  { --font-scale: 1.3; }
  body[data-font-scale="1.5"]  { --font-scale: 1.5; }
  body[data-font-scale="1.75"] { --font-scale: 1.75; }
  body[data-font-scale="2"]    { --font-scale: 2; }

  input, button, select { border-radius: 0 !important; }

  /* ── Checking pulse ── */
  @keyframes checking-pulse {
    0%, 100% { border-color: #505868; opacity: 0.7; }
    50%      { border-color: #ffb95f; opacity: 1;   }
  }
  .checking-in-progress {
    animation: checking-pulse 1.4s ease-in-out infinite;
  }

  /* ── Health report ── */
  .health-report {
    max-height: 200px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: #424754 #030914;
  }
  .health-report::-webkit-scrollbar { width: 4px; }
  .health-report::-webkit-scrollbar-track { background: #030914; }
  .health-report::-webkit-scrollbar-thumb { background: #424754; }
  .health-report::-webkit-scrollbar-thumb:hover { background: #8c909f; }
  .health-report textarea {
    resize: none;
    scrollbar-width: thin;
    scrollbar-color: #424754 #030914;
  }
  .health-report textarea::-webkit-scrollbar { width: 4px; }
  .health-report textarea::-webkit-scrollbar-track { background: #030914; }
  .health-report textarea::-webkit-scrollbar-thumb { background: #424754; }
  .health-report textarea::-webkit-scrollbar-thumb:hover { background: #8c909f; }
</style>
</head>
<body class="bg-[#040b18]" data-font-scale="1">
  <!-- Background -->
  <div class="bg-screen"></div>

  <!-- Decorative corners -->
  <div class="deco-corner deco-tl"></div>
  <div class="deco-corner deco-tr"></div>
  <div class="deco-corner deco-bl"></div>
  <div class="deco-corner deco-br"></div>

  <!-- Font size (top-right) -->
  <div class="top-actions">
    <div class="font-size-group" title="Adjust font size">
      <button id="launcher-font-size-minus" class="font-size-btn minus">-</button>
      <span id="launcher-font-size-label" class="font-size-label">1.0</span>
      <button id="launcher-font-size-plus" class="font-size-btn plus">+</button>
    </div>
  </div>

  <!-- Centered card -->
  <div class="fixed inset-0 flex items-center justify-center z-[1] pointer-events-none">
    <div class="login-card pointer-events-auto scalable">
      <!-- Brand -->
      <div class="login-brand">
        <div class="brand-icon">&gt;ƒ</div>
        <h1>FinForge</h1>
        <p>System launcher</p>
      </div>

      <!-- Actions -->
      <div class="btn-group">
        <button id="launcher-open-workbook" class="term-btn primary-action">Launch workbook</button>
        <button id="launcher-open-import" class="term-btn primary-action">Open terminal</button>
        <div class="btn-row">
          <button id="launcher-open-data-folder" class="term-btn">Open data folder</button>
          <button id="launcher-open-project-folder" class="term-btn">Open project folder</button>
        </div>
        <div class="btn-row">
          <button id="launcher-run-setup" class="term-btn">Run setup</button>
          <button id="launcher-run-uninstall" class="term-btn danger">Uninstall</button>
        </div>
      </div>

      <!-- Template selector -->
      <div id="launcher-template-section" class="mt-4 pt-4 border-t border-outline-variant">
        <div class="flex items-center justify-between mb-2">
          <span class="text-[9px] text-outline uppercase mono tracking-[0.1em]">Template</span>
          <span id="launcher-template-count" class="text-[9px] text-outline mono uppercase">0 templates</span>
        </div>
        <div class="flex items-stretch gap-2">
          <select id="launcher-template-select" class="flex-1 h-8 bg-surface-container border border-outline-variant px-2 font-label-md text-label-md text-on-surface focus:border-primary outline-none mono">
            <option value="">-- Choose template --</option>
          </select>
          <button id="launcher-template-load" class="px-3 py-1 bg-primary text-on-primary font-bold font-label-md text-label-md hover:opacity-90 transition-opacity uppercase mono" disabled>Load</button>
        </div>
        <div id="launcher-template-notes" class="mt-2 text-[10px] text-on-surface-variant mono leading-relaxed hidden"></div>
        <div id="launcher-template-status" class="mt-1 text-[9px] text-outline mono uppercase hidden"></div>
        <button id="launcher-template-replace-workbook" class="mt-2 w-full px-2 py-1 bg-surface-container-high border border-outline-variant font-label-md text-label-md hover:border-secondary hover:text-secondary transition-colors uppercase mono hidden">Replace workbook with template</button>
      </div>

      <!-- Health report -->
      <div id="launcher-health-report" class="hidden" style="margin-top:8px"></div>

      <!-- Status -->
      <div class="status-row">
        <span class="status-label"><span id="setup-dot" class="status-dot amber"></span><span id="setup-text">Checking...</span></span>
        <span class="status-label">FinForge v1.0</span>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer-copy">&copy; FinForge</div>

  <script src="./launcher_renderer.js"></script>
</body>
</html>
